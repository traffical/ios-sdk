disabled_rules:
  - trailing_comma
  - todo
  - line_length
  - function_body_length
  - type_body_length
  - file_length
  - cyclomatic_complexity
  - large_tuple
  # Else / catch on their own line is common in this codebase, e.g.
  #   do { try work() }
  #   catch { handler(error) }
  - statement_position
  # We use shorthand identifiers liberally for closure params, dictionary
  # iteration, etc. Reinstating the default 3-char minimum would just force
  # noise like `key`/`value` everywhere with no real readability gain.
  - identifier_name
  # URLProtocol subclasses must use `override class func` to match the
  # parent signature, so `static_over_final_class` would force unsound
  # rewrites in test support code.
  - static_over_final_class

opt_in_rules:
  # Host safety (spec S11): a force unwrap is a latent crash in someone
  # else's app. `force_try` and `force_cast` stay on (defaults).
  - force_unwrapping
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - sorted_first_last
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_string
  - redundant_nil_coalescing
  - unused_import

included:
  - Sources
  - Tests

excluded:
  - .build
  - sdk-spec
  - Examples

force_unwrapping:
  severity: error

custom_rules:
  # Foundation raises an uncatchable ObjC exception for NaN/Infinity or
  # non-JSON types. Every write goes through TrafficalJSONWriter, which
  # sanitizes first (spec S11).
  raw_json_write:
    # Shipped code only; test fixtures and doubles are exempt.
    included: ".*/Sources/.*\\.swift"
    name: "Raw JSONSerialization write"
    regex: 'JSONSerialization\.data\(\s*withJSONObject'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Use TrafficalJSONWriter.data(_:) — JSONSerialization raises on NaN/Infinity."
    severity: error
  # Int(Double) traps on NaN/Infinity/out-of-range; fixed-width conversions
  # trap on overflow. Use exactly:/clamping:/truncatingIfNeeded:, the
  # TrafficalNumeric helpers, or annotate a provably-safe site with
  # `// swiftlint:disable:next unchecked_int_conversion` and a reason.
  unchecked_int_conversion:
    # Shipped code only; test fixtures and doubles are exempt.
    included: ".*/Sources/.*\\.swift"
    name: "Unchecked integer conversion"
    regex: '\b(Int|Int8|Int16|Int32|Int64|UInt|UInt8|UInt16|UInt32|UInt64)\((?!\s*(exactly|clamping|truncatingIfNeeded|bitPattern):)'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Integer conversion can trap. Use exactly:/clamping:/truncatingIfNeeded: or TrafficalNumeric (spec S11)."
    severity: error

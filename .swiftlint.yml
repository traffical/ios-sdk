disabled_rules:
  - trailing_comma
  - todo
  - line_length
  - function_body_length
  - type_body_length
  - file_length
  - cyclomatic_complexity
  - large_tuple
  # Else / catch on their own line is common in this codebase, e.g.
  #   do { try work() }
  #   catch { handler(error) }
  - statement_position
  # We use shorthand identifiers liberally for closure params, dictionary
  # iteration, etc. Reinstating the default 3-char minimum would just force
  # noise like `key`/`value` everywhere with no real readability gain.
  - identifier_name

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - sorted_first_last
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_string
  - redundant_nil_coalescing
  - unused_import

included:
  - Sources
  - Tests

excluded:
  - .build
  - sdk-spec
  - Examples

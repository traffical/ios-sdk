name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test --enable-code-coverage

  simulator-build:
    name: iOS simulator build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build SDK for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Traffical \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build sample app for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Examples/TrafficalSampleApp/TrafficalSampleApp.xcodeproj \
            -scheme TrafficalSampleApp \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO

  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --strict

  spec-pin-freshness:
    name: sdk-spec pin freshness (stale-pin gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fail if the pinned sdk-spec is behind the latest spec tag
        run: |
          set -euo pipefail
          cd sdk-spec
          git fetch --tags --force origin
          # Latest semver-ish tag on the spec repo (e.g. v0.7.0).
          latest_tag="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$latest_tag" ]; then
            echo "No tags found on sdk-spec; skipping stale-pin gate."
            exit 0
          fi
          pinned="$(git rev-parse HEAD)"
          tagged="$(git rev-list -n1 "$latest_tag")"
          echo "Pinned submodule commit: $pinned"
          echo "Latest spec tag:         $latest_tag ($tagged)"
          if [ "$pinned" != "$tagged" ]; then
            echo "::error::sdk-spec submodule is not pinned to the latest spec tag ($latest_tag)."
            echo "Update the submodule: git -C sdk-spec fetch --tags && git -C sdk-spec checkout $latest_tag && git add sdk-spec"
            exit 1
          fi
          echo "sdk-spec pin is up to date with $latest_tag."
